name: sincronizar agenda

on:
  schedule:
    - cron: "17 * * * *"     # de hora em hora (reserva; o vigia do notebook dispara na hora)
  workflow_dispatch:          # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: puxar Moodle + Google Agenda
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          AGENDA_SENHA: ${{ secrets.AGENDA_SENHA }}
          GCAL_ICS: ${{ secrets.GCAL_ICS }}
          SITE_URL: https://nicdolfini-sys.github.io/agenda
        run: python scripts/sync.py

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

      # O GitHub desliga agendamentos de repositórios sem commits há 60 dias.
      - name: manter o agendamento vivo
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "agenda-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "manter agendamento ativo"
            git push
          fi
